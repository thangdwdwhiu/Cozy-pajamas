services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - uploads:/app/uploads
  worker:
    image: node:22-alpine
    env_file: .env
    environment:
      WORKER_APP_URL: http://app:3000
    volumes:
      - ./scripts/worker.mjs:/worker.mjs:ro
    command: [node, /worker.mjs]
    depends_on:
      - app
    restart: unless-stopped
volumes:
  uploads:
