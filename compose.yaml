services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cozy_pajamas
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cozy -d cozy_pajamas"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cozy:${POSTGRES_PASSWORD}@db:5432/cozy_pajamas
      DIRECT_DATABASE_URL: ""
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  tools:
    profiles: [tools]
    build:
      context: .
      target: tooling
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cozy:${POSTGRES_PASSWORD}@db:5432/cozy_pajamas
      DIRECT_DATABASE_URL: ""
    depends_on:
      db:
        condition: service_healthy
    command: [npm, run, db:migrate]
  worker:
    image: node:22-alpine
    env_file: .env
    environment:
      WORKER_APP_URL: http://app:3000
    volumes:
      - ./scripts/worker.mjs:/worker.mjs:ro
    command: [node, /worker.mjs]
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
